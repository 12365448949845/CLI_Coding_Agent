[project]
name = "mewcode"
version = "0.1.0"
description = "A multi-protocol LLM terminal conversation client."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.80",
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".uv-cache", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
